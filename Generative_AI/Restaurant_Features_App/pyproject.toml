[project]
name = "restaurant-features-app"
version = "0.1.0"
description = "A Streamlit app for generating restaurant names and menu items using LangChain"
readme = "README.md"
requires-python = ">=3.9,<4.0"
dependencies = [
    "streamlit==1.38.0",
    "langchain==0.3.1",
    "langchain-openai==0.2.1",
    "python-dotenv==1.0.1",
    "tenacity==8.3.0",
]

[tool.uv]
managed = true