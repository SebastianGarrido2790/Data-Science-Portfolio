[project]
name = "nyc_taxis_project"
version = "0.1.0"
description = "Predictive model for yellow taxi demand in Manhattan"
authors = [{ name = "Sebastian Garrido", email = "sebastiangarrido279@gmail.com" }]
requires-python = ">=3.10,<3.12"
dependencies = [
    "pandas>=2.0.0",
    "dask>=2023.3.0",
    "pyspark>=3.4.0",
    "scikit-learn>=1.2.0",
    "statsmodels>=0.13.0",
    "seaborn>=0.12.0",
    "matplotlib>=3.7.0",
    "anonymizeip>=1.0.0",
    "pyarrow>=15.0.0",
    "plotly>=5.0.0",
    "mlflow>=2.0.0",
    "xgboost>=1.6.0",
    "prophet>=1.1.0",
    "optuna>=3.0.0",
    "shap>=0.42.0",
    "onnxmltools>=1.11.0",
    "docker>=7.0.0",
    "flask>=2.0.0",
    "waitress>=2.0.0",
    "kubernetes>=26.0.0",
    "prometheus_client>=0.17.0",
    "schedule>=1.1.0",
    "streamlit>=1.46.0",
]

[tool.uv]
dev-dependencies = [
    "jupyter>=1.0.0",
    "pytest>=7.0.0"
]
